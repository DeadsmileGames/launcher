<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' https:; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Deadsmile Games</title>
  <link rel="stylesheet" href="./launcher-ui.css">
  <link rel="stylesheet" href="./game-view.css">
</head>
<body>
  <main class="game-view">
    <header class="game-meta game-view__toolbar" data-interactive>
      <strong>Deadsmile Games</strong>
      <kbd id="shortcut">Ctrl + D</kbd>
      <button type="button" id="refresh" class="btn btn--secondary" data-i18n="refresh">Refresh</button>
      <button type="button" id="close" class="btn btn--secondary" data-i18n="close">Close</button>
    </header>
    <section class="game-meta game-view__panel game-view__profile" data-interactive aria-labelledby="profile-heading">
      <h2 id="profile-heading" data-i18n="profile">Profile</h2>
      <div class="game-view__identity">
        <div id="avatar" class="game-view__avatar"></div>
        <div><strong id="username"></strong><p id="playing"></p></div>
      </div>
      <p id="profile-error" class="launcher-error" role="alert" hidden></p>
    </section>
    <section class="game-meta game-view__panel game-view__library" data-interactive aria-labelledby="library-heading">
      <header class="game-view__panel-heading"><h2 id="library-heading" data-i18n="library">Library</h2><span id="library-count"></span></header>
      <p id="library-error" class="launcher-error" role="alert" hidden></p>
      <ul id="games" class="game-view__list" aria-live="polite"></ul>
    </section>
    <section class="game-meta game-view__panel game-view__cloud" data-interactive aria-labelledby="cloud-heading">
      <header class="game-view__panel-heading"><h2 id="cloud-heading" data-i18n="cloud">Cloud saves</h2></header>
      <p id="cloud-game" class="game-view__muted"></p>
      <div id="cloud-list" class="game-view__list" aria-live="polite"></div>
    </section>
    <section class="game-meta game-view__panel game-view__achievements" data-interactive aria-labelledby="achievements-heading">
      <header class="game-view__panel-heading"><h2 id="achievements-heading" data-i18n="achievements">Achievements</h2><span id="achievement-count"></span></header>
      <p id="achievement-game" class="game-view__muted"></p>
      <ul id="items" class="game-view__list" aria-live="polite"></ul>
    </section>
    <p id="status" class="game-meta game-view__status launcher-error" role="alert" data-interactive hidden></p>
  </main>
  <script src="./error-catalog.js"></script>
  <script src="./game-view.js"></script>
</body>
</html>
