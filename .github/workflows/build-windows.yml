name: Build and Release Windows Launcher

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build installer
        run: npm run build:windows

      - name: Build unpacked launcher for auto updater
        run: npm run package:update

      - name: Create updater ZIP and standalone launcher executable
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $zipName = "Deadsmile-Games-Launcher-$version.zip"

          if (-not (Test-Path "release/win-unpacked")) {
            Write-Error "release/win-unpacked not found — package:update failed"
            exit 1
          }

          Compress-Archive -Path "release/win-unpacked/*" -DestinationPath "release/$zipName" -Force

          Write-Host "✓ Created $zipName"
          Get-ChildItem release -File | Select-Object Name, Length

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Deadsmile-Games-Launcher-Windows
          path: |
            release/*.exe
            release/*.zip
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Deadsmile Games Launcher ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            release/Deadsmile-Games-Launcher-Setup-*.exe
            release/Deadsmile-Games-Launcher-*.zip