name: Publish Deadsmile WinUI MSIX Release

on:
  workflow_run:
    workflows: ["Build Deadsmile WinUI MSIX"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: production-release-v1-0-0
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Checkout validated production commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.x'

      - name: Build the Store-identity MSIX only
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $packageVersion = "1.0.0.0"
          "STORE_PACKAGE_VERSION=$packageVersion" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Production Store package version: $packageVersion"
          ./winui/scripts/build-windows.ps1 -PackageVersion $packageVersion
          if ($LASTEXITCODE -ne 0) { throw "MSIX build failed." }

      - name: Verify manifest and MSIX-only output
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $artifacts = "winui/artifacts"
          $packages = @(Get-ChildItem $artifacts -Filter "*.msix" -File)
          if ($packages.Count -ne 1) { throw "Expected exactly one MSIX artifact." }
          $unexpected = @(Get-ChildItem $artifacts -File | Where-Object { $_.Extension -in @(".exe", ".msi", ".msp", ".appx", ".appxbundle", ".zip") })
          if ($unexpected.Count -gt 0) { throw "Unexpected distribution file(s): $($unexpected.Name -join ', ')" }
          $manifestPath = Join-Path $artifacts "msix-content/AppxManifest.xml"
          if (!(Test-Path $manifestPath)) { throw "Production MSIX manifest was not generated." }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($packages[0].FullName)
          try {
            $entry = $archive.GetEntry("AppxManifest.xml")
            if ($null -eq $entry) { throw "Packaged MSIX does not contain AppxManifest.xml." }
            $reader = [System.IO.StreamReader]::new($entry.Open())
            try { $manifest = [xml]$reader.ReadToEnd() } finally { $reader.Dispose() }
          } finally { $archive.Dispose() }
          $identity = $manifest.DocumentElement.SelectSingleNode("*[local-name()='Identity']")
          $properties = $manifest.DocumentElement.SelectSingleNode("*[local-name()='Properties']")
          if ($identity.GetAttribute("Name") -ne "DeadsmileGames.DeadsmileGamesLauncher") { throw "Store package Name mismatch." }
          if ($identity.GetAttribute("Publisher") -ne "CN=A4BCCCEE-CD9B-459A-A0BC-BFDD3D7DBDFE") { throw "Store Publisher mismatch." }
          if ($identity.GetAttribute("Version") -ne $env:STORE_PACKAGE_VERSION) { throw "Unexpected Store package version." }
          if ($properties.SelectSingleNode("*[local-name()='PublisherDisplayName']").InnerText -ne "Deadsmile Games") { throw "Publisher display name mismatch." }
          Write-Host "PASS official Store identity and package version $($env:STORE_PACKAGE_VERSION)"
          Write-Host "Only distribution package: $($packages[0].Name)"

      - name: Publish only the MSIX to the v1.0.0 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $repo = $env:GITHUB_REPOSITORY
          $tag = "v1.0.0-winui"
          $title = "Deadsmile Games Launcher v1.0.0"
          $notesPath = Join-Path $env:RUNNER_TEMP "release-notes.md"
          @'
          ## Deadsmile Games Launcher 1.0.0 — WinUI 3

          - Distribution artifact: one MSIX package only.
          - Official Microsoft Store identity reserved in Partner Center.
          - This is the MSIX submission package. Microsoft signs the Store-distributed package after certification; this pre-submission MSIX is not directly installable unless a trusted signature is applied.
          '@ | Set-Content -Path $notesPath -Encoding utf8

          $currentMain = gh api "repos/$repo/git/ref/heads/main" --jq ".object.sha"
          if ($LASTEXITCODE -ne 0) { throw "Could not read main branch." }
          if ($currentMain.Trim() -ne $env:SOURCE_SHA) {
            Write-Host "main has advanced beyond this successful build; a newer successful build will publish instead."
            exit 0
          }

          $msix = @(Get-ChildItem "winui/artifacts" -Filter "*.msix" -File)
          if ($msix.Count -ne 1 -or $msix[0].Name -ne "Deadsmile-Games-Launcher-WinUI-1.0.0-x64.msix") {
            throw "Expected exactly the version 1.0.0 production MSIX."
          }

          $tagJson = gh api "repos/$repo/git/ref/tags/$tag" 2>$null
          $tagExists = $LASTEXITCODE -eq 0
          if ($tagExists) {
            $tagRef = $tagJson | ConvertFrom-Json
            if ($tagRef.object.sha -ne $env:SOURCE_SHA) {
              throw "Refusing to move immutable production tag $tag from its existing source commit."
            }
          } else {
            gh api --method POST "repos/$repo/git/refs" -f "ref=refs/tags/$tag" -f "sha=$env:SOURCE_SHA" *> $null
            if ($LASTEXITCODE -ne 0) { throw "Could not create the v1.0.0 production tag." }
          }

          $existingJson = gh release view $tag --repo $repo --json assets 2>$null
          $hasRelease = $LASTEXITCODE -eq 0
          if ($hasRelease) {
            $existing = $existingJson | ConvertFrom-Json
            if ($existing.assets.Count -eq 1 -and $existing.assets[0].name -eq $msix[0].Name) {
              $verifyDir = Join-Path $env:RUNNER_TEMP "existing-production-release"
              New-Item -ItemType Directory -Path $verifyDir -Force | Out-Null
              gh release download $tag --repo $repo --pattern $msix[0].Name --dir $verifyDir
              if ($LASTEXITCODE -ne 0) { throw "Could not verify the existing release asset." }
              $existingAsset = Join-Path $verifyDir $msix[0].Name
              if (!(Test-Path $existingAsset)) { throw "The release asset download did not produce the expected MSIX." }
              $existingHash = (Get-FileHash $existingAsset -Algorithm SHA256).Hash
              $currentHash = (Get-FileHash $msix[0].FullName -Algorithm SHA256).Hash
              if ($existingHash -ne $currentHash) {
                throw "The immutable release asset differs from the deterministic package rebuilt from the same commit."
              }
              Write-Host "The immutable release contains the exact validated MSIX bytes; leaving it unchanged."
              exit 0
            }
            if ($existing.assets.Count -gt 0) {
              throw "The immutable v1.0.0 release has different assets; refusing to replace release contents."
            }
            gh release edit $tag --repo $repo --title $title --notes-file $notesPath
            if ($LASTEXITCODE -ne 0) { throw "Could not update notes for the existing empty v1.0.0 release." }
          } else {
            gh release create $tag --repo $repo --verify-tag --title $title --notes-file $notesPath
            if ($LASTEXITCODE -ne 0) { throw "Could not create v1.0.0 release." }
          }

          gh release upload $tag $msix[0].FullName --repo $repo
          if ($LASTEXITCODE -ne 0) { throw "Could not upload the production MSIX release asset." }
          Write-Host "Published the version 1.0.0 MSIX-only release to $repo/releases/tag/$tag"
