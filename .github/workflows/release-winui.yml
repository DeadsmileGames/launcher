name: Publish Deadsmile WinUI MSIX Release

on:
  workflow_run:
    workflows: ["Build Deadsmile WinUI MSIX"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: production-release-v1-0-0
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Checkout validated production commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build the Store-identity MSIX only
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $storeBuild = [Math]::Max(1, [int]$env:GITHUB_RUN_NUMBER)
          $packageVersion = "1.0.$storeBuild.0"
          "STORE_PACKAGE_VERSION=$packageVersion" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Store package version: $packageVersion"
          ./winui/scripts/build-windows.ps1 -PackageVersion $packageVersion
          if ($LASTEXITCODE -ne 0) { throw "MSIX build failed." }

      - name: Verify manifest and MSIX-only output
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $artifacts = "winui/artifacts"
          $packages = @(Get-ChildItem $artifacts -Filter "*.msix" -File)
          if ($packages.Count -ne 1) { throw "Expected exactly one MSIX artifact." }
          $unexpected = @(Get-ChildItem $artifacts -File | Where-Object { $_.Extension -in @(".exe", ".msi", ".msp", ".appx", ".appxbundle", ".zip") })
          if ($unexpected.Count -gt 0) { throw "Unexpected distribution file(s): $($unexpected.Name -join ', ')" }
          $manifestPath = Join-Path $artifacts "msix-content/AppxManifest.xml"
          if (!(Test-Path $manifestPath)) { throw "Production MSIX manifest was not generated." }
          $manifest = [xml](Get-Content $manifestPath -Raw)
          $identity = $manifest.DocumentElement.SelectSingleNode("*[local-name()='Identity']")
          $properties = $manifest.DocumentElement.SelectSingleNode("*[local-name()='Properties']")
          if ($identity.GetAttribute("Name") -ne "DeadsmileGames.DeadsmileGamesLauncher") { throw "Store package Name mismatch." }
          if ($identity.GetAttribute("Publisher") -ne "CN=A4BCCCEE-CD9B-459A-A0BC-BFDD3D7DBDFE") { throw "Store Publisher mismatch." }
          if ($identity.GetAttribute("Version") -ne $env:STORE_PACKAGE_VERSION) { throw "Unexpected Store package version." }
          if ($properties.SelectSingleNode("*[local-name()='PublisherDisplayName']").InnerText -ne "Deadsmile Games") { throw "Publisher display name mismatch." }
          Write-Host "PASS official Store identity and package version $($env:STORE_PACKAGE_VERSION)"
          Write-Host "Only distribution package: $($packages[0].Name)"

      - name: Publish only the MSIX to the v1.0.0 release
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $repo = $env:GITHUB_REPOSITORY
          $tag = "v1.0.0"
          $title = "Deadsmile Games Launcher v1.0.0"
          $notesPath = Join-Path $env:RUNNER_TEMP "release-notes.md"
          @'
          ## Deadsmile Games Launcher 1.0.0 — WinUI 3

          - Download: the MSIX package only.
          - Store identity: the official identity reserved in Partner Center.
          - This unsigned MSIX is intended for Partner Center submission. Microsoft signs the Store-distributed package after certification; the pre-submission file is not directly installable until it has a trusted signature.
          '@ | Set-Content -Path $notesPath -Encoding utf8

          $currentMain = gh api "repos/$repo/git/ref/heads/main" --jq ".object.sha"
          if ($LASTEXITCODE -ne 0) { throw "Could not read main branch." }
          if ($currentMain.Trim() -ne $env:SOURCE_SHA) {
            Write-Host "main has advanced beyond this successful build; a newer successful build will publish instead."
            exit 0
          }

          gh api "repos/$repo/git/ref/tags/$tag" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh api --method PATCH "repos/$repo/git/refs/tags/$tag" -f "sha=$env:SOURCE_SHA" -F "force=true" *> $null
          } else {
            gh api --method POST "repos/$repo/git/refs" -f "ref=refs/tags/$tag" -f "sha=$env:SOURCE_SHA" *> $null
          }
          if ($LASTEXITCODE -ne 0) { throw "Could not set production tag to the validated source commit." }

          $existingJson = gh release view $tag --repo $repo --json assets 2>$null
          $hasRelease = $LASTEXITCODE -eq 0
          if ($hasRelease) {
            $existing = $existingJson | ConvertFrom-Json
            foreach ($asset in $existing.assets) {
              gh release delete-asset $tag $asset.name --yes --repo $repo
              if ($LASTEXITCODE -ne 0) { throw "Could not remove old release asset $($asset.name)." }
            }
            gh release edit $tag --repo $repo --title $title --notes-file $notesPath
            if ($LASTEXITCODE -ne 0) { throw "Could not update existing v1.0.0 release." }
          } else {
            gh release create $tag --repo $repo --verify-tag --title $title --notes-file $notesPath
            if ($LASTEXITCODE -ne 0) { throw "Could not create v1.0.0 release." }
          }

          $msix = @(Get-ChildItem "winui/artifacts" -Filter "*.msix" -File)
          if ($msix.Count -ne 1) { throw "Expected exactly one MSIX release asset." }
          gh release upload $tag $msix[0].FullName --clobber --repo $repo
          if ($LASTEXITCODE -ne 0) { throw "Could not upload the MSIX release asset." }
          Write-Host "Published the MSIX-only release to $repo/releases/tag/$tag"
