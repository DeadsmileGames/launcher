name: Build and Release Windows Launcher
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build installer and publish to GitHub
        run: npm run build:windows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build unpacked launcher for auto updater
        run: npm run package:update

      - name: Create updater ZIP
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $zipName = "Deadsmile-Games-Launcher-$version.zip"

          if (-not (Test-Path "release/win-unpacked")) {
            Write-Error "release/win-unpacked not found"
            exit 1
          }

          Compress-Archive -Path "release/win-unpacked/*" -DestinationPath "release/$zipName" -Force
          Get-ChildItem release -File | Select-Object Name, Length

      - name: Upload ZIP to the release
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "${{ github.ref_name }}"
          $zipName = "Deadsmile-Games-Launcher-$version.zip"

          gh release upload $tag "release/$zipName" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}