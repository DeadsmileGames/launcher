name: Publish Deadsmile WinUI Release

on:
  workflow_run:
    workflows: ["Build Deadsmile WinUI"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: production-release-v1-0-0
  cancel-in-progress: false

jobs:
  publish:
    if: \${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      GH_TOKEN: \${{ github.token }}
      SOURCE_SHA: \${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Checkout validated production commit
        uses: actions/checkout@v7
        with:
          ref: \${{ github.event.workflow_run.head_sha }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Install NSIS
        shell: pwsh
        run: |
          $installed = $false
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            $tool = Get-Command "makensis.exe" -ErrorAction SilentlyContinue
            $candidate = Join-Path ([Environment]::GetEnvironmentVariable("ProgramFiles(x86)")) "NSIS\makensis.exe"
            if ($tool -or (Test-Path $candidate)) { $installed = $true; break }
            choco install nsis --yes --no-progress --execution-timeout=1800
            if ($LASTEXITCODE -eq 0) { $installed = $true; break }
            if ($attempt -lt 3) { Start-Sleep -Seconds (10 * $attempt) }
          }
          if (!$installed) { throw "NSIS installation failed after three attempts." }

      - name: Build Store-identity MSIX and unsigned backup EXE
        shell: pwsh
        run: |
          $runNumber = [int]$env:GITHUB_RUN_NUMBER
          $storeBuild = [Math]::Max(0, $runNumber - 1)
          $packageVersion = "1.0.$storeBuild.0"
          "STORE_PACKAGE_VERSION=$packageVersion" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Public release version: 1.0.0; Store package version: $packageVersion"
          ./winui/scripts/build-windows.ps1 -Target All -PackageVersion $packageVersion
          if ($LASTEXITCODE -ne 0) { throw "Production artifact build failed." }

      - name: Verify production package identity and version
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $manifestPath = "winui/artifacts/msix-content/AppxManifest.xml"
          if (!(Test-Path $manifestPath)) { throw "Production MSIX manifest was not generated." }
          $manifest = [xml](Get-Content $manifestPath -Raw)
          $identity = $manifest.DocumentElement.SelectSingleNode("*[local-name()='Identity']")
          $properties = $manifest.DocumentElement.SelectSingleNode("*[local-name()='Properties']")
          $version = ([xml](Get-Content "winui/Directory.Build.props" -Raw)).Project.PropertyGroup.Version
          if ($identity.GetAttribute("Name") -ne "DeadsmileGames.DeadsmileGamesLauncher") { throw "Store package Name mismatch." }
          if ($identity.GetAttribute("Publisher") -ne "CN=A4BCCCEE-CD9B-459A-A0BC-BFDD3D7DBDFE") { throw "Store Publisher mismatch." }
          if ($identity.GetAttribute("Version") -ne $env:STORE_PACKAGE_VERSION) { throw "Unexpected Store package version." }
          if ($properties.SelectSingleNode("*[local-name()='PublisherDisplayName']").InnerText -ne "Deadsmile Games") { throw "Publisher display name mismatch." }
          Write-Host "PASS Microsoft Store identity and package version $($env:STORE_PACKAGE_VERSION)"

      - name: Package the native WinUI source and calculate SHA-256
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $artifacts = "winui/artifacts"
          $sourceZip = Join-Path $artifacts "Deadsmile-Games-Launcher-1.0.0-source.zip"
          git archive --format=zip --output="$sourceZip" "$env:SOURCE_SHA" winui
          if ($LASTEXITCODE -ne 0) { throw "Native source archive failed." }

          $payloads = @(Get-ChildItem $artifacts -File | Where-Object { $_.Extension -in @(".exe", ".msix", ".zip") })
          if (!($payloads | Where-Object { $_.Extension -eq ".exe" -and $_.Name -like "*Setup*" })) { throw "Setup EXE missing." }
          if (!($payloads | Where-Object { $_.Extension -eq ".msix" })) { throw "Store MSIX missing." }
          if (!($payloads | Where-Object { $_.Name -like "*source.zip" })) { throw "WinUI source ZIP missing." }

          $sumLines = @()
          foreach ($file in $payloads) {
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            [IO.File]::WriteAllText($file.FullName + ".sha256", "$hash  $($file.Name)" + [Environment]::NewLine, [Text.UTF8Encoding]::new($false))
            $sumLines += "$hash  $($file.Name)"
          }
          [IO.File]::WriteAllLines((Join-Path $artifacts "SHA256SUMS.txt"), $sumLines, [Text.UTF8Encoding]::new($false))
          Get-Content (Join-Path $artifacts "SHA256SUMS.txt")

      - name: Replace v1.0.0 release with validated WinUI production assets
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $repo = $env:GITHUB_REPOSITORY
          $tag = "v1.0.0"
          $title = "Deadsmile Games Launcher v1.0.0"
          $notesPath = Join-Path $env:RUNNER_TEMP "release-notes.md"
          @'
          ## Deadsmile Games Launcher 1.0.0 — WinUI 3

          - Source code: native WinUI 3 project (winui/ only).
          - MSIX: built with the Microsoft Store package identity and intended for submission through Partner Center. Microsoft signs the Store-distributed package after certification.
          - EXE: standalone backup installer, intentionally unsigned. Windows SmartScreen may show an unknown-app warning; the Microsoft Store is the recommended download.
          - Integrity: SHA-256 sidecar files and SHA256SUMS.txt are included.
          '@ | Set-Content -Path $notesPath -Encoding utf8

          $currentMain = gh api "repos/$repo/git/ref/heads/main" --jq ".object.sha"
          if ($LASTEXITCODE -ne 0) { throw "Could not read main branch." }
          if ($currentMain.Trim() -ne $env:SOURCE_SHA) {
            Write-Host "main has advanced beyond this successful build; a newer successful build will publish instead."
            exit 0
          }

          gh api "repos/$repo/git/ref/tags/$tag" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh api --method PATCH "repos/$repo/git/refs/tags/$tag" -f "sha=$env:SOURCE_SHA" -F "force=true" *> $null
          } else {
            gh api --method POST "repos/$repo/git/refs" -f "ref=refs/tags/$tag" -f "sha=$env:SOURCE_SHA" *> $null
          }
          if ($LASTEXITCODE -ne 0) { throw "Could not set production tag to the validated source commit." }

          $existingJson = gh release view $tag --repo $repo --json assets 2>$null
          $hasRelease = $LASTEXITCODE -eq 0
          if ($hasRelease) {
            $existing = $existingJson | ConvertFrom-Json
            foreach ($asset in $existing.assets) {
              gh release delete-asset $tag $asset.name --yes --repo $repo
              if ($LASTEXITCODE -ne 0) { throw "Could not remove old release asset $($asset.name)." }
            }
            gh release edit $tag --repo $repo --title $title --notes-file $notesPath
            if ($LASTEXITCODE -ne 0) { throw "Could not update existing v1.0.0 release." }
          } else {
            gh release create $tag --repo $repo --verify-tag --title $title --notes-file $notesPath
            if ($LASTEXITCODE -ne 0) { throw "Could not create v1.0.0 release." }
          }

          $files = @(Get-ChildItem "winui/artifacts" -File | Where-Object {
            $_.Extension -in @(".exe", ".msix", ".zip", ".sha256") -or $_.Name -eq "SHA256SUMS.txt"
          } | ForEach-Object { $_.FullName })
          if ($files.Count -lt 6) { throw "Expected production files and their SHA-256 sidecars." }
          gh release upload $tag @files --clobber --repo $repo
          if ($LASTEXITCODE -ne 0) { throw "Could not upload production release assets." }
          Write-Host "Published validated WinUI artifacts to $repo/releases/tag/$tag"
